name: Test report
description: What happened when you tried it. Successful runs count too.
title: "[test] "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        ◥(◔ ◔)◤ ◢(◕ ◕)◣ ◥(◔ ◔)◤ ◢(◕ ◕)◣ ◥(◔ ◔)◤

        **What this is for.** I'm testing whether a FIP radio stream survives
        a weak or dropping connection — and whether my instructions make sense
        on a machine that isn't mine. Every field below is something I can't
        see from here.

        Not a peer evaluation, nothing is graded, and a failed test is the
        most useful kind.

        **One minute.** Seven quick fields, five of them dropdowns. Leave the rest empty.

        Please strip passwords, tokens, IP addresses, private Wi-Fi names and
        MAC addresses from anything you paste.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - "Linux"
        - "macOS"
        - "Windows / WSL"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: ran
    attributes:
      label: What did you actually run?
      description: All three are valid tests. Running only the mpv command is fine and expected.
      options:
        - "The mpv command only (no script)"
        - "fip-stream.sh"
        - "Both"
        - "Neither — I only read the docs"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install mpv?
      options:
        - "apt (Ubuntu/Debian repos)"
        - "Flatpak (--user, no sudo)"
        - "Homebrew"
        - "Already had it"
        - "Did not install anything"
        - "Other / built from source"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      description: OS and version. Audio stack too, if you happen to know it.
      placeholder: "Ubuntu 24.04, PipeWire 1.0.5 — or just: macOS 15.1"
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - "Wi-Fi"
        - "LTE hotspot"
        - "Ethernet"
        - "Other / unstable"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      description: If you cut the network mid-playback, judge by whether the stream came back on its own.
      options:
        - "Played, and recovered on its own after a network cut"
        - "Played, but did not recover after a network cut"
        - "Played, I did not test a network cut"
        - "Started but was unstable"
        - "Did not start"
        - "Got stuck before playback — install or instructions"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happened
      description: A sentence is enough. If you got stuck, say on which step.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or tag
      description: It's in the URL you followed, e.g. .../blob/v16.3/... Leave empty if unsure.
      placeholder: "v16.3"

  - type: input
    id: output
    attributes:
      label: Audio output
      description: Built-in, wired, or a Bluetooth device model. No MAC addresses.
      placeholder: "built-in"

  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: "The AO: line and anything red. Personal data removed."
      render: shell

  - type: input
    id: credit
    attributes:
      label: Name or GitHub handle (optional)
      description: Only fill this if you want to be named. Leave empty and the report stays anonymous.

  - type: checkboxes
    id: consent
    attributes:
      label: Optional
      options:
        - label: You may list me in TESTED_ENVIRONMENTS.md as someone who tested this.
        - label: I removed passwords, tokens, IP addresses, private Wi-Fi names and MAC addresses.
          required: true
