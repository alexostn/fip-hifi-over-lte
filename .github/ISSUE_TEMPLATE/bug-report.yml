name: Bug report
description: A step that does not work, or an instruction that is wrong or unclear.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ◥(◔ ◔)◤ ◢(◕ ◕)◣ ◥(◔ ◔)◤ ◢(◕ ◕)◣ ◥(◔ ◔)◤ ◢(◕ ◕)◣ ◥(◔ ◔)◤

        **Please remove passwords, tokens, IP addresses, private Wi-Fi names
        and MAC addresses** from any output or screenshot before submitting.

  - type: input
    id: version
    attributes:
      label: Version or tag
      placeholder: "v16.3"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Ubuntu 24.04, PipeWire 1.0.5"
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Where it broke
      description: File and step or command.
      placeholder: "BLUETOOTH_LDAC.md, step 4 (pactl list sinks)"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What the document says should happen, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that reproduces it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Last lines of the error, with personal data removed.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens, IP addresses, private Wi-Fi names and MAC addresses.
          required: true
